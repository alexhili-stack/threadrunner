<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
  <meta name="theme-color" content="#08090b">
  <meta name="description" content="Threadrunner: carry the last signal through an electric foundry.">
  <title>Threadrunner</title>
  <link rel="icon" href="icon.svg" type="image/svg+xml">
  <link rel="stylesheet" href="site.css">
  <script src="site.js" defer></script>
</head>
<body data-page="boot">
  <main id="player" aria-label="Threadrunner game player">
    <div class="stage">
      <iframe id="game" title="Threadrunner game" allow="autoplay; fullscreen; gamepad" allowfullscreen></iframe>
      <div id="boot" class="boot">
        <img src="icon.svg" alt="" width="72" height="72">
        <h1>THREADRUNNER</h1>
        <button id="play" class="primary">Play in browser</button>
        <p id="loading" role="status">Carry the last signal.</p>
        <progress id="progress" max="100" hidden aria-label="Game download progress"></progress>
        <noscript>JavaScript and WebGL 2 are needed to play.</noscript>
      </div>
    </div>
      <div id="touch" class="touch" hidden aria-label="Touch controls">
        <div class="movement-actions" aria-label="Move">
        <button data-action="move_left" aria-label="Move left"><svg viewBox="0 0 20 20" aria-hidden="true"><path d="m12 5-5 5 5 5"/></svg><span>Left</span></button>
        <button data-action="move_right" aria-label="Move right"><svg viewBox="0 0 20 20" aria-hidden="true"><path d="m8 5 5 5-5 5"/></svg><span>Right</span></button>
        </div>
        <div class="thread-actions" aria-label="Thread tools">
          <button data-action="thread_stitch"><span class="action-name">Stitch</span><span class="action-state">Find terminal</span></button>
          <button data-action="thread_grapple"><span class="action-name">Grapple</span><span class="action-state">Find anchor</span></button>
          <button data-action="thread_rewind"><span class="action-name">Rewind</span><span class="action-state">Hold to return</span></button>
          <button id="touch-pause" disabled>Pause</button>
        </div>
        <div class="jump-actions">
          <button data-action="jump" class="jump">Jump<span class="action-state">Hold for height</span></button>
          <button data-action="restart">Retry</button>
        </div>
      </div>

    <nav class="browser-tools" aria-label="Player settings">
      <button id="pause" disabled>Resume</button>
      <button id="fullscreen">Fullscreen</button>
      <button id="touch-toggle" aria-pressed="false">Touch controls</button>
      <a href="third_party/" target="_blank" rel="noopener">Credits</a>
    </nav>
    <section id="help-panel" class="help-panel" aria-label="How to play" hidden>
      <div><h1>The thread</h1><button id="help-return">Back to pause</button></div>
      <p id="help-copy"></p><p id="objective" hidden></p>
      <p id="save-help">Progress saves in this browser. Clearing site data removes it.</p>
      <p>Controller: stick / D-pad, A jump, X stitch, B grapple, LB rewind, Y retry, Start pause.</p>
    </section>
  </main>
  <p id="status" class="sr-only" role="status" aria-live="polite"></p>
  <output id="game-state" hidden></output><pre id="qa-report" hidden></pre>
</body>
</html>
